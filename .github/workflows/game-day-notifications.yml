name: Game Day Push Reminders
on:
  schedule:
    # Every day: international, holiday and Saturday games included.
    - cron: '*/5 0-5,12-23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send kickoff-window notifications to opted-in subscribers
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send-kickoff-alerts.py
