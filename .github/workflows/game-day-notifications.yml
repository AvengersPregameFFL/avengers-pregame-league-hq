name: Game Day Push Reminders
on:
  schedule:
    # Every day: international, holiday and Saturday games included.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_subscription:
        description: 'Optional OneSignal push subscription ID for a private remote delivery test'
        required: false
        type: string
concurrency:
  group: game-day-push-reminders
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send kickoff and completed-week notifications
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TEST_SUBSCRIPTION: ${{ inputs.test_subscription }}
        run: |
          if [ -n "$TEST_SUBSCRIPTION" ]; then
            python scripts/send-kickoff-alerts.py --test
          else
            python scripts/send-kickoff-alerts.py
          fi
