name: Refresh League Record Book
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-book-sync.yml'
      - 'scripts/refresh_record_book.py'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-book-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild completed weekly records from Sleeper
        env:
          SLEEPER_LEAGUE_ID: '1395849826633019392'
        run: python scripts/refresh_record_book.py
      - name: Commit refreshed records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record-book.json data/coach-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh completed-week league records"
          git pull --rebase origin main
          git push origin HEAD:main
