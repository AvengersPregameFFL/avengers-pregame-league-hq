name: Deploy League HQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: league-hq-release-v2
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out app
        uses: actions/checkout@v4
      - name: Verify installable app files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
      - name: Validate four-story homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert all(f'href="#story-{slug}"' in html for slug in ('travis','jugs','nick','allysa')), 'Missing story links'
          assert html.count('<section class="page headline-page"') == 4, 'Expected four standalone story pages'
          assert html.count('<article class="hp-story-slide') == 4, 'Expected four complete articles'
          assert 'id="hp-story-track"' not in html, 'Old oversized homepage carousel still present'
          PY
      - name: Generate mobile app icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg, json
          from pathlib import Path
          for size in (180, 192, 512):
              cairosvg.svg2png(url='icons/icon.svg', write_to=f'icons/icon-{size}.png', output_width=size, output_height=size)
          path=Path('manifest.webmanifest')
          manifest=json.loads(path.read_text())
          manifest['icons']=[
              {'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}]
          path.write_text(json.dumps(manifest,indent=2))
          html=Path('index.html')
          html.write_text(html.read_text().replace('href="./icons/icon.svg" type="image/svg+xml"','href="./icons/icon-180.png"'))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
