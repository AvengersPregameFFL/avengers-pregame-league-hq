name: Deploy League HQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: league-hq-release-v2
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out app
        uses: actions/checkout@v4
      - name: Verify installable app files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f service-worker.js
      - name: Validate four-story homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          assert all(f'href="./stories/{slug}.html"' in html for slug in ('travis','jugs','nick','allysa')), 'Missing standalone story links'
          assert '<section class="page headline-page"' not in html, 'Full articles must never be embedded in homepage'
          assert '<article class="hp-story-slide' not in html, 'Homepage contains an article instead of just headlines'
          for slug in ('travis','jugs','nick','allysa'):
              page=Path('stories',f'{slug}.html').read_text()
              assert '<article class="hp-story-slide' in page, f'Missing full article: {slug}'
              assert 'href="../index.html#home"' in page, f'Missing homepage return: {slug}'
          assert Path('stories/story-style.css').is_file(), 'Missing shared editorial styles'
          assert 'id="hp-story-track"' not in html, 'Old oversized homepage carousel still present'
          home=html.split('<section class="page home" id="home">',1)[1].split('</section>',1)[0]
          assert home.count('class="hp-menu"') == 1, 'Expected one consolidated League HQ navigation'
          assert 'hp-quick-nav' not in home, 'Redundant quick navigation returned'
          assert 'class="hp-stories"' not in home, 'Duplicate storylines cards returned'
          assert all(home.count(f'href="#{item}"') == 1 for item in ('pickem','survivor','standings','league-schedule')), 'Duplicate homepage navigation target'
          assert 'href="#awards"' in home and 'href="#award-guide"' in home, 'Distinct awards destinations missing'
          PY
      - name: Generate mobile app icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg, json
          from pathlib import Path
          for size in (180, 192, 512):
              cairosvg.svg2png(url='icons/icon.svg', write_to=f'icons/icon-{size}.png', output_width=size, output_height=size)
          path=Path('manifest.webmanifest')
          manifest=json.loads(path.read_text())
          manifest['icons']=[
              {'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}]
          path.write_text(json.dumps(manifest,indent=2))
          html=Path('index.html')
          html.write_text(html.read_text().replace('href="./icons/icon.svg" type="image/svg+xml"','href="./icons/icon-180.png"'))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
