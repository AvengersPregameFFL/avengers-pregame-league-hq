name: AI Command Center — read-only health
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'
permissions:
  contents: read
concurrency:
  group: ai-command-center-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed Sleeper snapshots
        run: python scripts/ai_health_check.py
