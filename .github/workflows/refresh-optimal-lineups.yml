name: Refresh Sleeper optimal lineups
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_optimal_lineups.py'
      - '.github/workflows/refresh-optimal-lineups.yml'
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
concurrency:
  group: sleeper-optimal-refresh
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate from Sleeper scoring and matchup rosters
        run: python scripts/refresh_optimal_lineups.py
      - name: Validate generated optimal lineup data
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          payload = json.loads(Path('data/optimal-lineups.json').read_text())
          rows = payload['rows']
          with Path('data/optimal-lineups.csv').open(newline='') as f:
              csv_rows = list(csv.DictReader(f))
          assert rows and len(rows) == len(csv_rows), 'JSON/CSV row mismatch or empty feed'
          assert all(r['week'] >= 1 and r['optimal'] >= r['actual'] - 0.02 for r in rows), 'Invalid week or optimal score'
          assert len({(r['week'], r['roster_id']) for r in rows}) == len(rows), 'Duplicate roster/week'
          print(f'Validated {len(rows)} lineup records across {len({r["week"] for r in rows})} weeks')
          PY
      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/optimal-lineups.json data/optimal-lineups.csv
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m "Refresh Sleeper optimal lineups"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Optimal lineup data published successfully'
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying"
            sleep 3
          done
          echo 'Failed to publish after five retries' >&2
          exit 1
