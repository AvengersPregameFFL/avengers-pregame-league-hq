name: Sync Survivor and Pickem from Bible
on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_league_contests.py'
      - '.github/workflows/league-contests-sync.yml'
permissions:
  contents: write
concurrency:
  group: league-contests-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Google authorization
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Google Sheets service account secret missing. Contest sync cannot run."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Read current Survivor and Pickem from Bible
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_league_contests.py
      - name: Commit public contest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league-contests.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Survivor and Pickem from Bible"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
