<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Awards | Avengers Pregame</title><style>body{margin:0;background:#2561db;background-image:radial-gradient(#ffffff22 2px,transparent 3px);background-size:22px 22px;color:#fff;font:700 16px Arial,sans-serif}.wrap{max-width:650px;margin:auto;padding:20px 16px 55px}h1{font:italic 900 36px Impact,Arial,sans-serif;text-shadow:3px 3px #111;margin:20px 0}a.back{display:inline-block;background:#ffdd22;color:#151121;border:3px solid #161121;box-shadow:4px 4px #141121;padding:11px 16px;text-decoration:none;font-weight:900}.hp-award{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#20172d;border:3px solid #0e0d18;border-left:9px solid #ffdf17;padding:15px 12px;margin:12px 0;box-shadow:4px 4px #0d1124}.hp-award details{flex:1;min-width:0}.hp-award summary{cursor:pointer;font:italic 900 21px Impact,Arial,sans-serif;color:#ffdf17}.hp-award-hint{display:block;font:700 10px Arial,sans-serif;color:white;font-style:normal;margin-top:5px}.hp-award-description{font:400 13px/1.5 Arial,sans-serif;color:#fff}.hp-award>a{color:#fff;text-decoration:none;font-weight:900;text-align:right;display:flex;align-items:center;gap:5px}.team-logo{display:none}#status{font:600 12px Arial,sans-serif;color:#e7efff;margin:8px 0 20px}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}</style></head><body><main class="wrap"><a class="back" href="./index.html">← BACK TO LEAGUE HQ</a><h1 id="title">WEEKLY AWARDS</h1><div id="status">Loading latest league awards…</div><div id="awards"></div></main><iframe id="source" src="./index.html" title="League data source" aria-hidden="true"></iframe><script>(function(){var f=document.getElementById('source'),out=document.getElementById('awards'),status=document.getElementById('status'),title=document.getElementById('title');function update(){try{var d=f.contentDocument;if(!d)return;var panel=d.querySelector('#home .hp-weekly-awards-compact>.hp-panel');var label=d.getElementById('weekly-awards-open');if(panel&&panel.querySelectorAll('.hp-award').length){out.innerHTML=Array.from(panel.querySelectorAll('.hp-award')).map(function(el){return el.outerHTML}).join('');if(label)title.textContent=label.textContent.replace('→','').trim();status.textContent='Live awards loaded from the league homepage.';return true}}catch(e){}return false}f.addEventListener('load',function(){update();setTimeout(update,1200);setTimeout(update,3500);setTimeout(update,7000)});setTimeout(function(){if(status.textContent.indexOf('Loading')===0)status.textContent='Live awards could not be verified. Open League HQ and check the current weekly awards section.'},9000)})();</script></body></html>
